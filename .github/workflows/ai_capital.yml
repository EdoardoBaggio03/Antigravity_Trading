name: AI Capital Autonomous Trader

on:
  # Pianificazione continua: Pre-market alle 09:00 Roma, trading ogni 30 min a mercato aperto (15:30-21:00 Roma) e bilancio serale
  schedule:
    - cron: '0 8 * * 1-5'         # 09:00 Roma (Pre-market & Piano)
    - cron: '*/30 14-19 * * 1-5'  # Ogni 30 minuti tra le 15:30 e le 20:30 Roma (Cicli Intraday)
    - cron: '5 20 * * 1-5'        # 21:05 Roma (Bilancio Serale & Apprendimento)

  # Permette anche l'avvio manuale con un clic da GitHub (anche da smartphone)
  workflow_dispatch:
    inputs:
      sessione:
        description: 'Quale sessione vuoi eseguire?'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - cycle
          - morning
          - open
          - midday
          - close

permissions:
  contents: write

jobs:
  run-trader:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui Stress Test Pre-Volo (0 Token)
        run: python test_devil_advocate.py

      - name: Esegui Sessione AI Capital
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEZONE: Europe/Rome
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python main.py --${{ inputs.sessione }}
          else
            python main.py --auto
          fi
          python dashboard.py --export

      - name: Salva Memoria Aggiornata nel Repository
        run: |
          cp docs/data.json data.json || true
          cp docs/index.html index.html || true
          git config user.name "AI Capital Bot"
          git config user.email "aicapital-bot@users.noreply.github.com"
          git add memory/stato_compatto.json memory/storico_completo.json memory/learning.json docs/data.json data.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(memory): aggiornamento automatico stato e apprendimento AI Capital [skip ci]"
            git pull --rebase origin main || true
            git push
          else
            echo "Nessuna modifica ai file di memoria da salvare."
          fi
